name: Heritage voice-to-AI memoir demo QA
on:
  push:
    branches: [main]
    paths:
      - 'voice-auto.html'
      - 'memoir-ai.html'
      - 'memoir-ui.mjs'
      - 'memoir-ai.mjs'
      - 'tests/memoir-ai.test.mjs'
      - 'index.html'
      - 'tests/voice-auto.spec.mjs'
      - '.github/workflows/voice-auto-qa.yml'
permissions:
  contents: read
concurrency:
  group: heritage-voice-demo-qa
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright (test dependency only)
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run deterministic editorial contracts and browser tests (mock AI, no model download)
        run: node --test tests/memoir-ai.test.mjs tests/voice-auto.spec.mjs
      - name: Verify speech page has no third-party scripts, and editorial page requires consent
        run: |
          node --input-type=module <<'HERITAGE_QA'
          import {readFileSync} from 'node:fs';
          const voice=readFileSync('voice-auto.html','utf8');
          const page=readFileSync('memoir-ai.html','utf8');
          const ui=readFileSync('memoir-ui.mjs','utf8');
          if (!voice.includes("connect-src 'none'") ||
              !voice.includes('processLocally=true') ||
              !voice.includes('consent-remote') || !voice.includes('to-ai')) process.exit(1);
          if (!page.includes('allow-model') ||
              !ui.includes("if(working||!$('allow-model').checked)") ||
              !ui.includes('https://esm.sh/@mlc-ai/web-llm@0.2.85?bundle')) process.exit(2);
          HERITAGE_QA
