name: Publish Heritage Demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'voice-auto.html'
      - 'memoir-ai.html'
      - 'memoir-ui.mjs'
      - 'memoir-ai.mjs'
      - 'model-evidence.mjs'
      - 'transcript-review.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: heritage-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public-only artifact
        run: |
          mkdir -p public
          # Explicit public-only allowlist: no private model files or recordings.
          cp index.html voice-auto.html transcript-review.html memoir-ai.html memoir-ui.mjs memoir-ai.mjs model-evidence.mjs public/
          test "$(find public -type f | wc -l)" -eq 7
          test -s public/index.html
          test -s public/voice-auto.html
          test -s public/transcript-review.html
          test -s public/memoir-ai.html
          test -s public/memoir-ui.mjs
          test -s public/memoir-ai.mjs
          test -s public/model-evidence.mjs
          ! grep -F 'http://127.0.0.1:11434' public/voice-auto.html
          ! grep -F 'http://127.0.0.1:11434' public/memoir-ai.html
          grep -F 'allow-model' public/memoir-ai.html
          grep -F 'NEEDS_NARRATOR_APPROVAL' public/memoir-ai.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
